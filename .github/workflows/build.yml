name: build

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: pellcorp release tag (empty = latest)
        required: false
      force:
        description: rebuild and replace the release if it already exists
        type: boolean
        default: false

permissions:
  contents: write

concurrency: build

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: pick pellcorp release
        id: pick
        run: |
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag=$(gh api repos/pellcorp/grumpyscreen/releases/latest --jq .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag-ff" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.force }}" = true ]; then
              echo "$tag-ff already released, force: rebuilding"
            else
              echo "$tag-ff already released"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - if: steps.pick.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - if: steps.pick.outputs.skip != 'true'
        name: toolchain image
        uses: docker/build-push-action@v6
        with:
          context: toolchain
          tags: grumpy-ff-toolchain
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - if: steps.pick.outputs.skip != 'true'
        name: build
        id: build
        # explicit bash = -eo pipefail, so a failed build.sh still fails through tee
        shell: bash
        run: ./build.sh "${{ steps.pick.outputs.tag }}" 2>&1 | tee build.log

      # build-logs branch: latest.log + one file per run, readable without login
      - if: always() && steps.pick.outputs.skip != 'true' && hashFiles('build.log') != ''
        name: save build log
        run: |
          log="$PWD/build.log"
          cd "$(mktemp -d)"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin build-logs; then
            git checkout -q -b build-logs FETCH_HEAD
          else
            git checkout -q --orphan build-logs
          fi
          cp "$log" latest.log
          cp "$log" "${GITHUB_RUN_ID}.log"
          git add latest.log "${GITHUB_RUN_ID}.log"
          git commit -qm "build log ${GITHUB_RUN_ID}: ${{ steps.pick.outputs.tag }} ${{ steps.build.outcome }}"
          git push -q origin build-logs

      - if: steps.pick.outputs.skip != 'true'
        name: release
        run: |
          tag="${{ steps.pick.outputs.tag }}"
          # force rebuild: replace the old release and its tag (only reached after a clean build)
          if [ "${{ steps.pick.outputs.exists }}" = true ]; then
            gh release delete "$tag-ff" --cleanup-tag --yes
          fi
          gh release create "$tag-ff" dist/grumpyscreen-ff.tar.gz \
            --title "$tag-ff" \
            --notes "pellcorp/grumpyscreen $tag ($(cut -d' ' -f2 dist/grumpyscreen/VERSION)) built for FlashForge: static, mips32r2, NaN2008, FP64, touch calibration on."
